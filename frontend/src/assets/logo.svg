<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 68" role="img" aria-labelledby="title">
  <title id="title">PRINTCHAIN</title>
  <desc>Compact angular wordmark. PRINT in black and CHAIN in red, with a white outline around every letter and overlapping letter spacing.</desc>
  <rect width="360" height="68" fill="none" />
  <g font-family="Arial Black, Montserrat, Arial, Helvetica, sans-serif"
     font-size="54" font-weight="900" letter-spacing="-4.5"
     stroke="#f4f5f7" stroke-width="3" paint-order="stroke fill">
    <!-- PRINT (en negre) -->
    <text x="0" y="50" fill="#000000">P<tspan dx="0">R</tspan><tspan dx="2">I</tspan><tspan dx="-2">N</tspan><tspan dx="1">T</tspan></text>
    <!-- CHAIN (en vermell) -->
    <text x="156" y="50" fill="#DA291C">C<tspan dx="0">H</tspan><tspan dx="-1">A</tspan><tspan dx="2">I</tspan><tspan dx="-2">N</tspan></text>
  </g>
</svg>
